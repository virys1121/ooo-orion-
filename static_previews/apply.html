<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Подача заявки - АНО ЦДО ОРИОН (Превью)</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 font-sans min-h-screen flex flex-col">
    <header class="bg-blue-700 text-white p-4">
        <div class="container mx-auto flex justify-between items-center">
            <h1 class="text-2xl font-bold">АНО ЦДО «ОРИОН»</h1>
            <a href="index.html" class="hover:underline">Назад на главную</a>
        </div>
    </header>

    <main class="flex-grow container mx-auto py-12 px-4 max-w-2xl">
        <h2 class="text-3xl font-bold mb-8 text-center">Заявление на поступление</h2>
        <div class="bg-white p-8 rounded-xl shadow-md space-y-4">
            <div>
                <label class="block text-sm font-medium mb-1">ФИО родителей</label>
                <input placeholder="Иванов Иван Иванович" class="w-full border p-2 rounded">
            </div>
            <div>
                <label class="block text-sm font-medium mb-1">ФИО ребенка</label>
                <input placeholder="Иванов Петр Иванович" class="w-full border p-2 rounded">
            </div>
            <div>
                <label class="block text-sm font-medium mb-1">Место работы</label>
                <input placeholder="Название организации" class="w-full border p-2 rounded">
            </div>
            <div>
                <label class="block text-sm font-medium mb-1">Email</label>
                <input placeholder="example@mail.ru" type="email" class="w-full border p-2 rounded">
            </div>
            <div>
                <label class="block text-sm font-medium mb-1">Пол ребенка</label>
                <select class="w-full border p-2 rounded">
                    <option>Мужской</option>
                    <option>Женский</option>
                </select>
            </div>
            <div>
                <label class="block text-sm font-medium mb-1">О себе и ребенке</label>
                <textarea placeholder="Расскажите о вашей семье" rows="4" class="w-full border p-2 rounded"></textarea>
            </div>
            <button class="w-full bg-blue-600 text-white py-3 rounded font-bold hover:bg-blue-700">Отправить (Демонстрация)</button>
        </div>
    </main>
</body>
</html>
