<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Поступление - ОРИОН</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-gray-50 text-gray-900">
    <div class="container mx-auto max-w-3xl py-16 px-4">
        <div class="bg-white rounded-[2.5rem] shadow-2xl overflow-hidden border border-gray-100">
            <div class="bg-blue-900 p-12 text-white">
                <h1 class="text-4xl font-black mb-4">Подача заявления</h1>
                <p class="text-blue-100">Заполните форму для рассмотрения кандидатуры вашего ребенка.</p>
            </div>
            <div class="p-12 space-y-8">
                <div class="grid md:grid-cols-2 gap-8">
                    <div>
                        <label class="block text-sm font-bold text-blue-900 uppercase mb-2">ФИО Родителя</label>
                        <input type="text" class="w-full border p-3 rounded-lg bg-gray-50" placeholder="Иванов Иван">
                    </div>
                    <div>
                        <label class="block text-sm font-bold text-blue-900 uppercase mb-2">ФИО Ребенка</label>
                        <input type="text" class="w-full border p-3 rounded-lg bg-gray-50" placeholder="Иванов Петр">
                    </div>
                </div>
                <div>
                    <label class="block text-sm font-bold text-blue-900 uppercase mb-2">Электронная почта</label>
                    <input type="email" class="w-full border p-3 rounded-lg bg-gray-50" placeholder="email@example.com">
                </div>
                <button class="w-full bg-blue-900 text-white p-4 rounded-xl font-black text-xl">Отправить заявление</button>
                <div class="text-center">
                    <a href="home.html" class="text-blue-600 hover:underline">Вернуться на главную</a>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
